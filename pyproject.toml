[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling in LLMs using constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["llm_sdk"]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 88
exclude = [".venv", "__pycache__", ".mypy_cache"]

[tool.pytest.ini_options]
pythonpath = ["."]
